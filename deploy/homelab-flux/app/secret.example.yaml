# NOT applied by Flux (not listed in kustomization.yaml, and the name does not
# match the .sops.yaml rule). Copy to secret.sops.yaml, fill in, encrypt in place:
#
#   cp secret.example.yaml secret.sops.yaml
#   $EDITOR secret.sops.yaml
#   SOPS_AGE_KEY_FILE=$PWD/age.key sops --encrypt --in-place secret.sops.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: bookorbit-mcp-secret
stringData:
  # Dedicated BookOrbit user for this server (see the permissions list in the
  # bookorbit-mcp README). Local password login must be allowed for it.
  BOOKORBIT_USERNAME: REPLACE_ME
  BOOKORBIT_PASSWORD: REPLACE_ME
  # "<team>" or "<team>.cloudflareaccess.com" -- Zero Trust > Settings.
  CF_ACCESS_TEAM_DOMAIN: REPLACE_ME
  # Application Audience (AUD) tag of the Access app for this hostname.
  CF_ACCESS_AUD: REPLACE_ME

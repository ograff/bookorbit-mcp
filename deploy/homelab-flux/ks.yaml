---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookorbit-mcp
spec:
  dependsOn:
    # Talks to BookOrbit's in-cluster Service; wait: false below (like most
    # apps here), the ordering hint just keeps a first apply from racing it.
    - name: bookorbit
      namespace: books
  interval: 1h
  path: ./kubernetes/apps/mcp/bookorbit-mcp/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: mcp
  wait: false

# Example only (not in kustomization.yaml). Create the real Secret with your
# secrets tooling (SOPS / external-secrets / kubectl create secret).
apiVersion: v1
kind: Secret
metadata:
  name: bookorbit-mcp-secret
stringData:
  BOOKORBIT_USERNAME: REPLACE_ME
  BOOKORBIT_PASSWORD: REPLACE_ME
  CF_ACCESS_TEAM_DOMAIN: REPLACE_ME # "<team>" or "<team>.cloudflareaccess.com"
  CF_ACCESS_AUD: REPLACE_ME # Access application AUD tag
